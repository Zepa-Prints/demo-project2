<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yashveer Constructions — Creating Spaces That Endure</title>
    <meta name="description" content="Yashveer Constructions builds homes, hospitals and hospitality spaces across Andhra Pradesh and Telangana. 14 years of construction experience — Kamala Residency, Isha Hospitals, Svaadishta and more." />
    <meta name="theme-color" content="#f8d207" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yashveer Constructions — Creating Spaces That Endure" />
    <meta property="og:description" content="Homes, hospitals and hospitality spaces across Andhra Pradesh and Telangana. 14 years of building experience." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: lets Netlify detect the enquiry form at deploy time (the real form is rendered by React) -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="mobile" />
      <input type="email" name="email" />
      <input type="text" name="property" />
      <input type="text" name="consent" />
      <input type="text" name="page" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
